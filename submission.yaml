submission:
  title: "Drug Safety Signal Detector & Submission Readiness Checker"   # REQUIRED — Project display name

  problem_statement: >                   # REQUIRED — 1-3 sentences. What problem? Who has it?
    FDA's FAERS database contains 20M+ adverse event reports — far too many for manual review,
    leading to delayed drug-safety signal detection that has caused real patient harm (e.g., Vioxx).
    Simultaneously, regulatory CTD dossiers span 100,000+ pages; a single missing section triggers
    rejection, costing 6–12 months and $50–100M. Both problems share the same root cause: too much
    complex data for human review alone.

  solution_summary: >                    # REQUIRED — 1-3 sentences. What did you build?
    A two-mode AI platform: Signal Detection ingests live FDA FAERS data, computes Proportional
    Reporting Ratios (PRR) to surface emerging drug-safety signals, and uses IBM watsonx.ai (Granite)
    to generate plain-language rationale per signal. Submission Readiness validates a user-provided
    dossier outline against the ICH M4 CTD 5-module checklist, scores completeness per module, and
    generates a prose gap report with actionable next steps via the same LLM.

  key_features:                          # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time FAERS adverse-event signal detection using PRR statistics (PRR ≥ 2, count ≥ 3 threshold)"
    - "IBM watsonx.ai (Granite) LLM integration for plain-language signal rationale and gap reports"
    - "ICH M4 CTD 5-module completeness checker with per-module scoring and overall readiness score"
    - "Offline fallback with bundled FAERS sample cache — demo works without internet access"
    - "FastAPI backend + Streamlit frontend with two clearly separated modes"

  tech_stack:
    languages: ["Python"]
    frameworks: ["FastAPI", "Streamlit"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "Granite model"]
    databases: []
    other: ["openFDA FAERS API", "GitHub Actions", "ICH M4 CTD standard"]

  what_we_are_most_proud_of: >           # Optional but recommended — guides judges to your best work
    The end-to-end integration between real FDA public data and IBM watsonx.ai reasoning: a user
    types a drug name, live adverse-event reports are fetched, PRR statistics surface signals that
    would otherwise take days to compute manually, and the Granite model instantly explains each
    signal in plain language a non-statistician can act on. The same LLM pivot to regulatory
    compliance demonstrates two genuinely different use-cases in one coherent AI platform.

  known_limitations: >                   # Optional but recommended — be honest about gaps
    PRR thresholds (PRR ≥ 2, report count ≥ 3) are simplified pharmacovigilance heuristics and
    have not been clinically validated — demo-grade signal flags only, not medical recommendations.
    The CTD checklist covers section titles and presence/absence, not the depth or quality of
    regulatory content. openFDA API is rate-limited to low volume; the bundled fallback cache is
    a small static sample. watsonx.ai LLM summaries are generative and should be reviewed by a
    qualified pharmacovigilance or regulatory professional before acting on them.

